<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>안산강서고 1-12</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');
  * { font-family: 'Gowun Dodum', sans-serif; box-sizing: border-box; }
  body { background:#FAF9F6; color:#2A2622; margin:0; }
  input[type="color"] { padding:0; cursor:pointer; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div id="app" class="w-full pb-16"></div>
<div id="modal-root"></div>

<script>
/* =========================================================================
   데이터 저장소: npoint.io (무료 온라인 저장소, CORS 지원)
   -------------------------------------------------------------------------
   관리자가 일정/디데이를 추가·수정·삭제하면 자동으로 이 주소에 저장되고,
   학생들은 새로고침하면 그 데이터를 자동으로 불러와요.
   GitHub에 다시 올릴 필요 없어요.
   ========================================================================= */
const DATA_URL = "https://api.npoint.io/b1e82724d029cc520ad3";
/* ========================================================================= */

const CATEGORIES = [
  { key: "homework", label: "숙제", color: "#D98A2B", checkable: true },
  { key: "notice", label: "가정통신문", color: "#6B5FAE", checkable: true },
  { key: "eval", label: "수행평가", color: "#C15A42", checkable: false },
  { key: "exam", label: "정기고사", color: "#A1332B", checkable: false },
  { key: "event", label: "행사", color: "#2C8C7F", checkable: false },
  { key: "alert", label: "알림", color: "#3E7CB1", checkable: false },
];
const SWATCHES = [
  "#D98A2B","#6B5FAE","#C15A42","#A1332B","#2C8C7F","#3E7CB1","#5B8A3C","#B45A9E",
  "#F7C6C7","#FBE4B0","#C9E4CA","#B5D8EB","#D6C7E8","#F9D5B0","#B8E0D2","#E8C7DE",
];
const EMOJI_PRESETS = ["📚","✏️","📝","🎉","📢","🧪","⏰","📌","🏆","📅"];
const ADMIN_PASSWORD = "829922";
const RANGE_MIN = { y: 2026, m: 7 };
const RANGE_MAX = { y: 2027, m: 2 };
const MIN_DATE_STR = "2026-08-01";
const MAX_DATE_STR = "2027-03-31";
const WEEKDAYS = ["일","월","화","수","목","금","토"];

function pad(n){ return String(n).padStart(2,"0"); }
function fmt(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function diffDays(a,b){ return Math.round((b-a)/86400000); }
function getCategory(key){ return CATEGORIES.find(c=>c.key===key) || CATEGORIES[0]; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function clampToRange(y,m){
  if (y < RANGE_MIN.y || (y===RANGE_MIN.y && m<RANGE_MIN.m)) return {y:RANGE_MIN.y,m:RANGE_MIN.m};
  if (y > RANGE_MAX.y || (y===RANGE_MAX.y && m>RANGE_MAX.m)) return {y:RANGE_MAX.y,m:RANGE_MAX.m};
  return {y,m};
}

const today = new Date();
const todayStr = fmt(today);
const initial = clampToRange(today.getFullYear(), today.getMonth());

const S = {
  viewYear: initial.y,
  viewMonth: initial.m,
  selectedDate: (todayStr>=MIN_DATE_STR && todayStr<=MAX_DATE_STR) ? todayStr : MIN_DATE_STR,
  events: [],
  ddays: [],
  isAdmin: false,
  toast: "",
  loading: true,
  loadError: false,
};

/* ---- npoint 자동 불러오기/저장 ---- */
async function loadFromServer(){
  try {
    const res = await fetch(DATA_URL, { headers: { "Accept": "application/json" } });
    if (!res.ok) throw new Error("fetch failed");
    const data = await res.json();
    S.events = Array.isArray(data.events) ? data.events : [];
    S.ddays = Array.isArray(data.ddays) ? data.ddays : [];
    S.loadError = false;
  } catch (e) {
    S.loadError = true;
  }
  S.loading = false;
  render();
}
async function saveToServer(){
  try {
    const res = await fetch(DATA_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ events: S.events, ddays: S.ddays }),
    });
    if (!res.ok) throw new Error("save failed");
  } catch (e) {}
}
// 다른 사람이 추가한 일정을 주기적으로 반영 (모달이 열려있지 않을 때만)
setInterval(()=>{
  const modalOpen = document.getElementById("modal-root") && document.getElementById("modal-root").innerHTML.trim()!=="";
  if (!modalOpen) loadFromServer();
}, 20000);


function showToast(msg){
  S.toast = msg;
  render();
  setTimeout(()=>{ S.toast=""; const t=document.getElementById("toast"); if(t) t.remove(); }, 1800);
}

/* ---- 계산 로직 ---- */
function ddayCountdown(dateStr){
  const diff = diffDays(parseDate(todayStr), parseDate(dateStr));
  if (diff>0) return { text:`D-${diff}`, tone:"#2E3153" };
  if (diff===0) return { text:"D-DAY", tone:"#2C8C7F" };
  return { text:"지남", tone:"#B5AD9C" };
}
function buildWeeks(viewYear, viewMonth){
  const firstDow = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const totalCells = Math.ceil((firstDow+daysInMonth)/7)*7;
  const cells = [];
  for (let i=0;i<totalCells;i++){
    const dayNum = i-firstDow+1;
    const dateObj = new Date(viewYear, viewMonth, dayNum);
    cells.push({ d: dateObj.getDate(), dateObj, inMonth: dayNum>=1 && dayNum<=daysInMonth });
  }
  const weeks = [];
  for (let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  return weeks;
}
function buildBars(weeks, barSource){
  return weeks.map(week=>{
    const weekStartStr = fmt(week[0].dateObj);
    const weekEndStr = fmt(week[6].dateObj);
    const overlapping = barSource.filter(it=> it.endDate>=weekStartStr && it.startDate<=weekEndStr);
    const sorted = [...overlapping].sort((a,b)=>{
      if (a.startDate!==b.startDate) return a.startDate<b.startDate?-1:1;
      return b.endDate.localeCompare(a.endDate);
    });
    const laneEnds = [];
    const bars = sorted.map(item=>{
      const cs = item.startDate<weekStartStr ? weekStartStr : item.startDate;
      const ce = item.endDate>weekEndStr ? weekEndStr : item.endDate;
      const startCol = diffDays(week[0].dateObj, parseDate(cs));
      const endCol = diffDays(week[0].dateObj, parseDate(ce));
      let lane = laneEnds.findIndex(e=>e<startCol);
      if (lane===-1){ lane=laneEnds.length; laneEnds.push(endCol); } else laneEnds[lane]=endCol;
      return { item, startCol, span: endCol-startCol+1, lane };
    });
    return { week, bars, laneCount: laneEnds.length };
  });
}
function eventsOnDate(dateStr){
  return S.events.filter(ev=> ev.startDate<=dateStr && ev.endDate>=dateStr)
    .sort((a,b)=> a.startDate<b.startDate?-1:1);
}

/* ---- 렌더링 ---- */
function render(){
  if (S.loading){
    document.getElementById("app").innerHTML = `<div class="max-w-2xl mx-auto px-5 py-16 text-center text-sm" style="color:#9A9284">불러오는 중...</div>`;
    return;
  }
  const weeks = buildWeeks(S.viewYear, S.viewMonth);
  const barSource = [
    ...S.events.map(ev=>({ id:ev.id, title:ev.title, emoji:ev.emoji, color:ev.color, startDate:ev.startDate, endDate:ev.endDate })),
    ...S.ddays.map(d=>({ id:"dday-"+d.id, title:d.title, emoji:d.emoji, color:d.color, startDate:d.startDate, endDate:d.endDate })),
  ];
  const weeksWithBars = buildBars(weeks, barSource);
  const atMin = S.viewYear===RANGE_MIN.y && S.viewMonth===RANGE_MIN.m;
  const atMax = S.viewYear===RANGE_MAX.y && S.viewMonth===RANGE_MAX.m;
  const ddaySorted = [...S.ddays].sort((a,b)=> a.startDate<b.startDate?-1:1);
  const selectedEvents = eventsOnDate(S.selectedDate);

  let html = `
  <div class="px-5 pt-7 pb-5 max-w-2xl mx-auto">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-bold" style="color:#2E3153">안산강서고 1-12</h1>
      ${S.isAdmin
        ? `<button data-action="exit-admin" class="flex items-center gap-1 text-xs px-3 py-1.5 rounded-full text-white" style="background:#6B5FAE">🔓 관리자</button>`
        : `<button data-action="open-pw" class="flex items-center gap-1 text-xs px-3 py-1.5 rounded-full" style="background:#EFEBE1;color:#6B6252">🔒 관리자</button>`}
    </div>
    <div class="flex items-center justify-center gap-4 mt-5">
      <button data-action="prev-month" ${atMin?"disabled":""} class="p-1.5 rounded-full" style="opacity:${atMin?0.3:1};background:#F1ECE0">‹</button>
      <div class="text-lg font-bold w-32 text-center" style="color:#2E3153">${S.viewYear}년 ${S.viewMonth+1}월</div>
      <button data-action="next-month" ${atMax?"disabled":""} class="p-1.5 rounded-full" style="opacity:${atMax?0.3:1};background:#F1ECE0">›</button>
    </div>
  </div>`;

  // D-day widget
  if (ddaySorted.length>0 || S.isAdmin){
    html += `<div class="max-w-2xl mx-auto px-5 mb-4">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-xs font-bold" style="color:#8A8272">디데이</span>
        ${S.isAdmin ? `<button data-action="open-dday-manage" class="flex items-center gap-1 text-[11px] px-2 py-1 rounded-full text-white" style="background:#2E3153">＋ 디데이 관리</button>` : ""}
      </div>
      ${ddaySorted.length>0 ? `<div class="flex gap-2 overflow-x-auto pb-1">${ddaySorted.map(item=>{
        const dd = ddayCountdown(item.startDate);
        return `<div class="flex-shrink-0 rounded-lg px-3 py-2" style="background:#fff;border:1px solid #EEE7D8;border-left:4px solid ${item.color};min-width:108px">
          <div class="text-[11px] font-bold" style="color:${dd.tone}">${dd.text}</div>
          <div class="text-xs mt-0.5 truncate" style="max-width:100px">${esc(item.emoji)} ${esc(item.title)}</div>
        </div>`;
      }).join("")}</div>` : (S.isAdmin ? `<p class="text-xs" style="color:#C9C0AC">등록된 디데이가 없어요.</p>` : "")}
    </div>`;
  }

  // Calendar
  html += `<div class="max-w-2xl mx-auto px-5">
    <div class="grid grid-cols-7 text-center text-xs mb-1">
      ${WEEKDAYS.map((w,i)=>`<div class="py-1 font-bold" style="color:${i===0?'#B23A32':i===6?'#3355A0':'#B5AD9C'}">${w}</div>`).join("")}
    </div>
    <div class="flex flex-col gap-0.5">
      ${weeksWithBars.map(wk=>{
        const weekHasSelected = wk.week.some(c=>fmt(c.dateObj)===S.selectedDate);
        return `<div class="rounded-md" style="background:${weekHasSelected?'#F4F1E8':'transparent'}">
          <div class="grid grid-cols-7">
            ${wk.week.map(cell=>{
              const dateStr = fmt(cell.dateObj);
              const dow = cell.dateObj.getDay();
              const inRange = dateStr>=MIN_DATE_STR && dateStr<=MAX_DATE_STR;
              const isSelected = dateStr===S.selectedDate;
              const isToday = dateStr===todayStr;
              return `<button data-action="select-date" data-date="${dateStr}" ${inRange?"":"disabled"} class="flex items-center justify-center py-1" style="opacity:${cell.inMonth&&inRange?1:0.28}">
                <span class="text-xs w-6 h-6 flex items-center justify-center rounded-full" style="color:${isSelected?'#fff':dow===0?'#B23A32':dow===6?'#3355A0':'#4A4438'};background:${isSelected?'#2E3153':'transparent'};font-weight:${isToday||isSelected?700:500};border:${isToday&&!isSelected?'1.5px solid #2E3153':'none'}">${cell.d}</span>
              </button>`;
            }).join("")}
          </div>
          ${wk.laneCount>0 ? `<div class="relative px-0.5 pb-1" style="height:${wk.laneCount*20}px">
            ${wk.bars.map(b=>`<button data-action="select-date" data-date="${b.item.startDate}" class="absolute text-[10px] px-1.5 flex items-center rounded truncate text-white text-left" style="left:${(b.startCol/7)*100}%;width:calc(${(b.span/7)*100}% - 3px);top:${b.lane*20}px;height:17px;background:${b.item.color};font-weight:600">${esc(b.item.emoji)} ${esc(b.item.title)}</button>`).join("")}
          </div>` : ""}
        </div>`;
      }).join("")}
    </div>
  </div>`;

  // Day detail
  html += `<div class="max-w-2xl mx-auto px-5 mt-6">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-base font-bold" style="color:#2E3153">${Number(S.selectedDate.split("-")[1])}월 ${Number(S.selectedDate.split("-")[2])}일</h2>
      ${S.isAdmin ? `<button data-action="open-add-event" class="flex items-center gap-1 text-xs px-3 py-1.5 rounded-full text-white" style="background:#2E3153">＋ 일정 추가</button>` : ""}
    </div>
    ${selectedEvents.length===0
      ? `<p class="text-sm py-6 text-center rounded-lg" style="color:#B5AD9C;background:#F4F1E8">등록된 일정이 없어요.</p>`
      : `<ul class="flex flex-col gap-2">${selectedEvents.map(ev=>{
          const cat = getCategory(ev.category);
          const isRange = ev.startDate!==ev.endDate;
          return `<li class="rounded-lg p-3 flex items-start gap-2" style="background:#fff;border:1px solid #EEE7D8;border-left:4px solid ${ev.color}">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-[10px] px-1.5 py-0.5 rounded" style="background:#F1ECE0;color:#6B6252">${cat.label}</span>
                ${(ev.tags||[]).map(t=>`<span class="text-[10px] px-1.5 py-0.5 rounded" style="background:#EFEAF7;color:#6B5FAE">#${esc(t)}</span>`).join("")}
              </div>
              <div class="text-sm font-bold mt-1" style="color:#2A2622">${esc(ev.emoji)} ${esc(ev.title)}</div>
              <div class="text-[11px] mt-0.5 flex items-center gap-2 flex-wrap" style="color:#9A9284">
                ${isRange?`<span>${ev.startDate.slice(5)} ~ ${ev.endDate.slice(5)}</span>`:""}
                ${ev.hasTime?`<span>🕐 ${ev.startTime}${ev.endTime?` ~ ${ev.endTime}`:""}</span>`:""}
              </div>
              ${ev.memo?`<p class="text-xs mt-1" style="color:#8A8272">${esc(ev.memo)}</p>`:""}
            </div>
            <div class="flex flex-col items-end gap-2 flex-shrink-0">
              ${S.isAdmin
                ? `<div class="flex gap-1">
                    <button data-action="open-edit-event" data-id="${ev.id}" class="p-1.5 rounded-md" style="background:#F4F1E8">✎</button>
                    ${S.confirmDeleteId===ev.id
                      ? `<button data-action="delete-event" data-id="${ev.id}" class="p-1.5 rounded-md text-white text-[10px] px-2" style="background:#B23A32">확인</button>`
                      : `<button data-action="confirm-delete-event" data-id="${ev.id}" class="p-1.5 rounded-md" style="background:#F4F1E8">🗑</button>`}
                  </div>`
                : ""}
            </div>
          </li>`;
        }).join("")}</ul>`}
  </div>`;

  if (S.toast) html += `<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 text-xs px-4 py-2 rounded-full text-white z-50" style="background:#2A2622;transform:translateX(-50%)">${esc(S.toast)}</div>`;

  document.getElementById("app").innerHTML = html;
}

/* ---- 액션 처리 ---- */
document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  const date = el.dataset.date;

  if (action==="prev-month"){ if(!(S.viewYear===RANGE_MIN.y&&S.viewMonth===RANGE_MIN.m)){ if(S.viewMonth===0){S.viewMonth=11;S.viewYear--;} else S.viewMonth--; render(); } }
  else if (action==="next-month"){ if(!(S.viewYear===RANGE_MAX.y&&S.viewMonth===RANGE_MAX.m)){ if(S.viewMonth===11){S.viewMonth=0;S.viewYear++;} else S.viewMonth++; render(); } }
  else if (action==="select-date"){ S.selectedDate=date; S.confirmDeleteId=null; render(); }
  else if (action==="open-pw"){ openPasswordModal(); }
  else if (action==="exit-admin"){ S.isAdmin=false; render(); showToast("학생 보기로 돌아왔어요"); }
  else if (action==="open-add-event"){ openEventForm(null); }
  else if (action==="open-edit-event"){ openEventForm(S.events.find(ev=>ev.id===id)); }
  else if (action==="confirm-delete-event"){ S.confirmDeleteId=id; render(); }
  else if (action==="delete-event"){ S.events=S.events.filter(ev=>ev.id!==id); saveToServer(); S.confirmDeleteId=null; render(); showToast("일정을 삭제했어요"); }
  else if (action==="open-dday-manage"){ openDdayManage(); }
  else if (action==="close-modal"){ closeModal(); }
});

/* ---- 비밀번호 모달 ---- */
function openPasswordModal(){
  document.getElementById("modal-root").innerHTML = `
  <div class="fixed inset-0 flex items-center justify-center px-6 z-50" style="background:rgba(30,27,20,0.4)">
    <div class="rounded-xl p-5 w-full max-w-xs" style="background:#FAF9F6">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-base font-bold" style="color:#2E3153">관리자 로그인</h3>
        <button data-action="close-modal">✕</button>
      </div>
      <input id="pw-input" type="password" placeholder="비밀번호" class="w-full rounded-md px-3 py-2 text-sm outline-none" style="border:1px solid #E4DDCC;background:#fff" autofocus />
      <p id="pw-error" class="text-xs mt-1.5" style="color:#B23A32"></p>
      <button id="pw-submit" class="w-full mt-3 rounded-md py-2 text-sm text-white font-bold" style="background:#2E3153">들어가기</button>
    </div>
  </div>`;
  const input = document.getElementById("pw-input");
  input.focus();
  function attempt(){
    if (input.value===ADMIN_PASSWORD){
      S.isAdmin=true; closeModal(); render(); showToast("관리자 모드로 전환했어요");
    } else {
      document.getElementById("pw-error").textContent = "비밀번호가 올바르지 않아요";
    }
  }
  document.getElementById("pw-submit").onclick = attempt;
  input.addEventListener("keydown", e=>{ if(e.key==="Enter") attempt(); });
}
function closeModal(){ document.getElementById("modal-root").innerHTML=""; }

/* ---- 일정 추가/수정 모달 ---- */
let FORM = null;
function openEventForm(ev){
  FORM = ev ? { ...ev, tags:[...(ev.tags||[])] } : {
    id: null, title:"", emoji:"", category:"homework", color:CATEGORIES[0].color,
    startDate:S.selectedDate, endDate:S.selectedDate, hasTime:false, startTime:"09:00", endTime:"10:00",
    tags:[], memo:""
  };
  renderEventForm();
}
function renderEventForm(){
  const f = FORM;
  document.getElementById("modal-root").innerHTML = `
  <div class="fixed inset-0 flex items-end sm:items-center justify-center z-50" style="background:rgba(30,27,20,0.4)">
    <div class="rounded-t-2xl sm:rounded-xl p-5 w-full max-w-md overflow-y-auto" style="background:#FAF9F6;max-height:88vh">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-bold" style="color:#2E3153">${f.id?"일정 수정":"일정 추가"}</h3>
        <button data-action="close-modal">✕</button>
      </div>
      <div class="flex flex-col gap-3">
        <div>
          <label class="text-xs" style="color:#8A8272">구분</label>
          <div id="cat-buttons" class="flex flex-wrap gap-1.5 mt-1">
            ${CATEGORIES.map(c=>`<button data-cat="${c.key}" data-color="${c.color}" class="cat-btn text-xs px-2.5 py-1.5 rounded-md font-bold" style="background:${f.category===c.key?'#2E3153':'#F1ECE0'};color:${f.category===c.key?'#fff':'#6B6252'}">${c.label}</button>`).join("")}
          </div>
        </div>
        <div class="flex gap-2">
          <div class="flex-1">
            <label class="text-xs" style="color:#8A8272">이모지</label>
            <input id="f-emoji" type="text" value="${esc(f.emoji)}" placeholder="📚" class="w-full rounded-md px-3 py-2 text-sm mt-1 outline-none" style="border:1px solid #E4DDCC;background:#fff" />
            <div class="flex flex-wrap gap-1 mt-1.5">${EMOJI_PRESETS.map(e=>`<button data-emoji-pick="${e}" class="text-sm px-1.5 py-0.5 rounded" style="background:#F1ECE0">${e}</button>`).join("")}</div>
          </div>
          <div style="width:96px">
            <label class="text-xs" style="color:#8A8272">색상</label>
            <input id="f-color" type="color" value="${f.color}" class="w-full h-9 rounded-md mt-1" style="border:1px solid #E4DDCC" />
            <div class="flex flex-wrap gap-1 mt-1.5">${SWATCHES.map(s=>`<button data-color-pick="${s}" style="width:14px;height:14px;border-radius:50%;background:${s}"></button>`).join("")}</div>
          </div>
        </div>
        <div>
          <label class="text-xs" style="color:#8A8272">제목</label>
          <input id="f-title" type="text" value="${esc(f.title)}" placeholder="예: 수학 3단원 익힘책 풀기" class="w-full rounded-md px-3 py-2 text-sm mt-1 outline-none" style="border:1px solid #E4DDCC;background:#fff" />
        </div>
        <div class="flex gap-2">
          <div class="flex-1">
            <label class="text-xs" style="color:#8A8272">시작일</label>
            <input id="f-start" type="date" value="${f.startDate}" min="${MIN_DATE_STR}" max="${MAX_DATE_STR}" class="w-full rounded-md px-2 py-2 text-sm mt-1 outline-none" style="border:1px solid #E4DDCC;background:#fff" />
          </div>
          <div class="flex-1">
            <label class="text-xs" style="color:#8A8272">종료일</label>
            <input id="f-end" type="date" value="${f.endDate}" min="${f.startDate}" max="${MAX_DATE_STR}" class="w-full rounded-md px-2 py-2 text-sm mt-1 outline-none" style="border:1px solid #E4DDCC;background:#fff" />
          </div>
        </div>
        <div>
          <button id="f-time-toggle" class="flex items-center gap-1 text-xs px-2.5 py-1.5 rounded-md font-bold" style="background:${f.hasTime?'#2E3153':'#F1ECE0'};color:${f.hasTime?'#fff':'#6B6252'}">🕐 시간 설정 ${f.hasTime?"끄기":"켜기"}</button>
          <div id="time-fields" class="flex gap-2 mt-2" style="display:${f.hasTime?'flex':'none'}">
            <div class="flex-1"><label class="text-xs" style="color:#8A8272">시작 시간</label>
              <input id="f-stime" type="time" value="${f.startTime}" class="w-full rounded-md px-2 py-2 text-sm mt-1 outline-none" style="border:1px solid #E4DDCC;background:#fff" /></div>
            <div class="flex-1"><label class="text-xs" style="color:#8A8272">종료 시간(선택)</label>
              <input id="f-etime" type="time" value="${f.endTime}" class="w-full rounded-md px-2 py-2 text-sm mt-1 outline-none" style="border:1px solid #E4DDCC;background:#fff" /></div>
          </div>
        </div>
        <div>
          <label class="text-xs" style="color:#8A8272">태그</label>
          <div class="flex gap-1.5 mt-1">
            <input id="f-tag-input" type="text" placeholder="예: 국어, 1모둠" class="flex-1 rounded-md px-3 py-2 text-sm outline-none" style="border:1px solid #E4DDCC;background:#fff" />
            <button id="f-tag-add" class="px-3 rounded-md text-xs font-bold" style="background:#F1ECE0;color:#6B6252">추가</button>
          </div>
          <div id="f-tag-list" class="flex flex-wrap gap-1 mt-1.5">${f.tags.map(t=>`<span class="tag-chip text-[11px] px-2 py-0.5 rounded flex items-center gap-1" style="background:#EFEAF7;color:#6B5FAE" data-tag="${esc(t)}">#${esc(t)} <button data-tag-remove="${esc(t)}">✕</button></span>`).join("")}</div>
        </div>
        <div>
          <label class="text-xs" style="color:#8A8272">메모 (선택)</label>
          <textarea id="f-memo" rows="2" placeholder="추가로 안내할 내용이 있다면 적어주세요" class="w-full rounded-md px-3 py-2 text-sm mt-1 outline-none resize-none" style="border:1px solid #E4DDCC;background:#fff">${esc(f.memo)}</textarea>
        </div>
        <button id="f-submit" class="w-full mt-1 rounded-md py-2.5 text-sm text-white font-bold" style="background:#2E3153">${f.id?"수정 완료":"저장하기"}</button>
      </div>
    </div>
  </div>`;
  bindEventFormListeners();
}
function bindEventFormListeners(){
  document.querySelectorAll(".cat-btn").forEach(btn=>{
    btn.onclick = ()=>{
      FORM.category = btn.dataset.cat;
      FORM.color = btn.dataset.color;
      document.querySelectorAll(".cat-btn").forEach(b=>{ b.style.background = b===btn?'#2E3153':'#F1ECE0'; b.style.color = b===btn?'#fff':'#6B6252'; });
      document.getElementById("f-color").value = FORM.color;
    };
  });
  document.querySelectorAll("[data-emoji-pick]").forEach(btn=>{
    btn.onclick = ()=>{ document.getElementById("f-emoji").value = btn.dataset.emojiPick; };
  });
  document.querySelectorAll("[data-color-pick]").forEach(btn=>{
    btn.onclick = ()=>{ document.getElementById("f-color").value = btn.dataset.colorPick; };
  });
  document.getElementById("f-start").onchange = (e)=>{
    const endInput = document.getElementById("f-end");
    endInput.min = e.target.value;
    if (endInput.value < e.target.value) endInput.value = e.target.value;
  };
  document.getElementById("f-time-toggle").onclick = ()=>{
    FORM.hasTime = !FORM.hasTime;
    const box = document.getElementById("time-fields");
    box.style.display = FORM.hasTime ? "flex" : "none";
    const btn = document.getElementById("f-time-toggle");
    btn.style.background = FORM.hasTime ? "#2E3153" : "#F1ECE0";
    btn.style.color = FORM.hasTime ? "#fff" : "#6B6252";
    btn.textContent = `🕐 시간 설정 ${FORM.hasTime?"끄기":"켜기"}`;
  };
  document.getElementById("f-tag-add").onclick = addTagFromInput;
  document.getElementById("f-tag-input").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); addTagFromInput(); } });
  document.getElementById("f-tag-list").addEventListener("click", e=>{
    const b = e.target.closest("[data-tag-remove]");
    if (b){ FORM.tags = FORM.tags.filter(t=>t!==b.dataset.tagRemove); refreshTagList(); }
  });
  document.getElementById("f-submit").onclick = submitEventForm;
}
function addTagFromInput(){
  const input = document.getElementById("f-tag-input");
  const t = input.value.trim();
  if (t && !FORM.tags.includes(t)) FORM.tags.push(t);
  input.value = "";
  refreshTagList();
}
function refreshTagList(){
  document.getElementById("f-tag-list").innerHTML = FORM.tags.map(t=>`<span class="tag-chip text-[11px] px-2 py-0.5 rounded flex items-center gap-1" style="background:#EFEAF7;color:#6B5FAE" data-tag="${esc(t)}">#${esc(t)} <button data-tag-remove="${esc(t)}">✕</button></span>`).join("");
}
function submitEventForm(){
  const title = document.getElementById("f-title").value.trim();
  const startDate = document.getElementById("f-start").value;
  const endDate = document.getElementById("f-end").value;
  if (!title){ showToast("제목을 입력해 주세요"); return; }
  if (endDate < startDate){ showToast("종료일이 시작일보다 빠를 수 없어요"); return; }
  const payload = {
    id: FORM.id || uid(),
    title,
    emoji: document.getElementById("f-emoji").value,
    category: FORM.category,
    color: document.getElementById("f-color").value,
    startDate, endDate,
    hasTime: FORM.hasTime,
    startTime: document.getElementById("f-stime") ? document.getElementById("f-stime").value : "09:00",
    endTime: document.getElementById("f-etime") ? document.getElementById("f-etime").value : "",
    tags: FORM.tags,
    memo: document.getElementById("f-memo").value,
  };
  if (FORM.id) S.events = S.events.map(ev=> ev.id===FORM.id ? payload : ev);
  else S.events = [...S.events, payload];
  saveToServer();
  closeModal();
  render();
  showToast(FORM.id ? "일정을 수정했어요" : "일정을 추가했어요");
}

/* ---- 디데이 관리 모달 ---- */
let DFORM = null;
function openDdayManage(){ DFORM = null; renderDdayManage(); }
function renderDdayManage(){
  const sorted = [...S.ddays].sort((a,b)=> a.startDate<b.startDate?-1:1);
  const f = DFORM || { title:"", emoji:"", color:SWATCHES[0], isRange:false, startDate:S.selectedDate, endDate:S.selectedDate };
  document.getElementById("modal-root").innerHTML = `
  <div class="fixed inset-0 flex items-end sm:items-center justify-center z-50" style="background:rgba(30,27,20,0.4)">
    <div class="rounded-t-2xl sm:rounded-xl p-5 w-full max-w-md overflow-y-auto" style="background:#FAF9F6;max-height:88vh">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-bold" style="color:#2E3153">디데이 관리</h3>
        <button data-action="close-modal">✕</button>
      </div>
      ${sorted.length>0 ? `<ul class="flex flex-col gap-1.5 mb-4">${sorted.map(item=>`
        <li class="rounded-md px-3 py-2 flex items-center justify-between" style="background:#fff;border:1px solid #EEE7D8;border-left:4px solid ${item.color}">
          <span class="text-sm truncate">${esc(item.emoji)} ${esc(item.title)} <span class="text-xs" style="color:#B5AD9C">· ${item.startDate===item.endDate?item.startDate:`${item.startDate} ~ ${item.endDate}`}</span></span>
          <div class="flex gap-1 flex-shrink-0">
            <button data-dday-edit="${item.id}" class="p-1.5 rounded-md" style="background:#F4F1E8">✎</button>
            ${S.confirmDeleteDdayId===item.id
              ? `<button data-dday-delete="${item.id}" class="p-1.5 rounded-md text-white text-[10px] px-2" style="background:#B23A32">확인</button>`
              : `<button data-dday-confirm-delete="${item.id}" class="p-1.5 rounded-md" style="background:#F4F1E8">🗑</button>`}
          </div>
        </li>`).join("")}</ul>` : ""}
      <div class="flex flex-col gap-3 pt-3" style="border-top:1px solid #EEE7D8">
        <p class="text-xs font-bold" style="color:#8A8272">${f.id?"디데이 수정":"새 디데이 추가"}</p>
        <div class="flex gap-2">
          <input id="d-emoji" type="text" value="${esc(f.emoji)}" placeholder="🏆" class="rounded-md px-3 py-2 text-sm outline-none" style="width:56px;border:1px solid #E4DDCC;background:#fff" />
          <input id="d-title" type="text" value="${esc(f.title)}" placeholder="예: 체육대회" class="flex-1 rounded-md px-3 py-2 text-sm outline-none" style="border:1px solid #E4DDCC;background:#fff" />
        </div>
        <div>
          <label class="text-xs" style="color:#8A8272">색상</label>
          <div class="flex items-center gap-2 mt-1">
            <input id="d-color" type="color" value="${f.color}" class="h-9" style="width:44px;border:1px solid #E4DDCC;border-radius:6px" />
            <div class="flex flex-wrap gap-1">${SWATCHES.map(s=>`<button data-dcolor-pick="${s}" style="width:14px;height:14px;border-radius:50%;background:${s}"></button>`).join("")}</div>
          </div>
        </div>
        <div><button id="d-range-toggle" class="text-xs px-2.5 py-1.5 rounded-md font-bold" style="background:${f.isRange?'#2E3153':'#F1ECE0'};color:${f.isRange?'#fff':'#6B6252'}">기간 설정 ${f.isRange?"끄기":"켜기"}</button></div>
        <div id="d-single" style="display:${f.isRange?'none':'block'}">
          <label class="text-xs" style="color:#8A8272">날짜</label>
          <input id="d-start-single" type="date" value="${f.startDate}" min="${MIN_DATE_STR}" max="${MAX_DATE_STR}" class="w-full rounded-md px-3 py-2 text-sm mt-1 outline-none" style="border:1px solid #E4DDCC;background:#fff" />
        </div>
        <div id="d-range" class="flex gap-2" style="display:${f.isRange?'flex':'none'}">
          <div class="flex-1"><label class="text-xs" style="color:#8A8272">며칠부터 (D-day 기준일)</label>
            <input id="d-start-range" type="date" value="${f.startDate}" min="${MIN_DATE_STR}" max="${MAX_DATE_STR}" class="w-full rounded-md px-2 py-2 text-sm mt-1 outline-none" style="border:1px solid #E4DDCC;background:#fff" /></div>
          <div class="flex-1"><label class="text-xs" style="color:#8A8272">며칠까지</label>
            <input id="d-end-range" type="date" value="${f.endDate}" min="${f.startDate}" max="${MAX_DATE_STR}" class="w-full rounded-md px-2 py-2 text-sm mt-1 outline-none" style="border:1px solid #E4DDCC;background:#fff" /></div>
        </div>
        <div class="flex gap-2">
          ${f.id ? `<button id="d-cancel" class="flex-1 rounded-md py-2.5 text-sm font-bold" style="background:#F1ECE0;color:#6B6252">취소</button>` : ""}
          <button id="d-submit" class="flex-1 rounded-md py-2.5 text-sm text-white font-bold" style="background:#2E3153">${f.id?"수정 완료":"추가하기"}</button>
        </div>
      </div>
    </div>
  </div>`;
  bindDdayFormListeners();
}
function bindDdayFormListeners(){
  document.querySelectorAll("[data-dday-edit]").forEach(btn=>{
    btn.onclick = ()=>{ const item = S.ddays.find(d=>d.id===btn.dataset.ddayEdit); DFORM = { ...item, isRange: item.startDate!==item.endDate }; renderDdayManage(); };
  });
  document.querySelectorAll("[data-dday-confirm-delete]").forEach(btn=>{
    btn.onclick = ()=>{ S.confirmDeleteDdayId = btn.dataset.ddayConfirmDelete; renderDdayManage(); };
  });
  document.querySelectorAll("[data-dday-delete]").forEach(btn=>{
    btn.onclick = ()=>{ S.ddays = S.ddays.filter(d=>d.id!==btn.dataset.ddayDelete); saveToServer(); S.confirmDeleteDdayId=null; renderDdayManage(); render(); showToast("디데이를 삭제했어요"); };
  });
  document.querySelectorAll("[data-dcolor-pick]").forEach(btn=>{
    btn.onclick = ()=>{ document.getElementById("d-color").value = btn.dataset.dcolorPick; };
  });
  const rangeToggle = document.getElementById("d-range-toggle");
  let isRange = document.getElementById("d-range").style.display !== "none";
  rangeToggle.onclick = ()=>{
    isRange = !isRange;
    document.getElementById("d-single").style.display = isRange ? "none" : "block";
    document.getElementById("d-range").style.display = isRange ? "flex" : "none";
    rangeToggle.style.background = isRange ? "#2E3153" : "#F1ECE0";
    rangeToggle.style.color = isRange ? "#fff" : "#6B6252";
    rangeToggle.textContent = `기간 설정 ${isRange?"끄기":"켜기"}`;
    if (isRange) document.getElementById("d-start-range").value = document.getElementById("d-start-single").value;
    else document.getElementById("d-start-single").value = document.getElementById("d-start-range").value;
  };
  document.getElementById("d-start-range").onchange = (e)=>{
    const endInput = document.getElementById("d-end-range");
    endInput.min = e.target.value;
    if (endInput.value < e.target.value) endInput.value = e.target.value;
  };
  const cancelBtn = document.getElementById("d-cancel");
  if (cancelBtn) cancelBtn.onclick = ()=>{ DFORM=null; renderDdayManage(); };
  document.getElementById("d-submit").onclick = ()=>{
    const title = document.getElementById("d-title").value.trim();
    const startDate = isRange ? document.getElementById("d-start-range").value : document.getElementById("d-start-single").value;
    const endDate = isRange ? document.getElementById("d-end-range").value : startDate;
    if (!title || !startDate){ showToast("제목과 날짜를 입력해 주세요"); return; }
    if (endDate < startDate){ showToast("종료일이 시작일보다 빠를 수 없어요"); return; }
    const payload = { title, emoji: document.getElementById("d-emoji").value, color: document.getElementById("d-color").value, startDate, endDate };
    if (DFORM && DFORM.id) S.ddays = S.ddays.map(d=> d.id===DFORM.id ? { ...payload, id:DFORM.id } : d);
    else S.ddays = [...S.ddays, { ...payload, id: uid() }];
    saveToServer();
    DFORM = null;
    renderDdayManage();
    render();
    showToast("저장했어요");
  };
}

/* ---- 시작 ---- */
loadFromServer();

</script>
</body>
</html>
