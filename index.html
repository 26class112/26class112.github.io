function hexToRgb(hex){
  hex = (hex||"#999999").replace("#","");
  if (hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const num = parseInt(hex,16) || 0x999999;
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function mixRgb(a,b,t){ return { r:Math.round(a.r+(b.r-a.r)*t), g:Math.round(a.g+(b.g-a.g)*t), b:Math.round(a.b+(b.b-a.b)*t) }; }
function rgbToHex(c){ return "#"+[c.r,c.g,c.b].map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,"0")).join(""); }

function ddayCountdown(startDate, endDate){
  endDate = endDate || startDate;
  const t = parseDate(todayStr), s = parseDate(startDate), e = parseDate(endDate);
  if (t>=s && t<=e) return { text:"진행중", tone:"#2C8C7F" };
  if (t<s) return { text:`D-${diffDays(t,s)}`, tone:"#2E3153" };
  return { text:"지남", tone:"#9b9a97" };
}
function buildWeeks(viewYear, viewMonth){
  const firstDow = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const totalCells = Math.ceil((firstDow+daysInMonth)/7)*7;
  const cells = [];
  for (let i=0;i<totalCells;i++){
    const dayNum = i-firstDow+1;
    const dateObj = new Date(viewYear, viewMonth, dayNum);
    cells.push({ d: dateObj.getDate(), dateObj, inMonth: dayNum>=1 && dayNum<=daysInMonth });
  }
  const weeks = [];
  for (let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  return weeks;
}
function buildBars(weeks, barSource){
  return weeks.map(week=>{
    const weekStartStr = fmt(week[0].dateObj);
    const weekEndStr = fmt(week[6].dateObj);
    const overlapping = barSource.filter(it=> it.endDate>=weekStartStr && it.startDate<=weekEndStr);
    const sorted = [...overlapping].sort((a,b)=>{
      if (a.startDate!==b.startDate) return a.startDate<b.startDate?-1:1;
      return b.endDate.localeCompare(a.endDate);
    });
    const laneEnds = [];
    const bars = sorted.map(item=>{
      const cs = item.startDate<weekStartStr ? weekStartStr : item.startDate;
      const ce = item.endDate>weekEndStr ? weekEndStr : item.endDate;
      const startCol = diffDays(week[0].dateObj, parseDate(cs));
      const endCol = diffDays(week[0].dateObj, parseDate(ce));
      let lane = laneEnds.findIndex(e=>e<startCol);
      if (lane===-1){ lane=laneEnds.length; laneEnds.push(endCol); } else laneEnds[lane]=endCol;
      return { item, startCol, span: endCol-startCol+1, lane };
    });
    return { week, bars, laneCount: laneEnds.length };
  });
}
function eventsOnDate(dateStr){

/* ---- 액션 처리 ---- */
document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-action]");
  if (!el) {
    if (S.menuOpen) { S.menuOpen = false; render(); }
    return;
  }
  if (S.menuOpen && el.dataset.action!=="toggle-menu" && el.dataset.action!=="go-page") { S.menuOpen = false; }
  const action = el.dataset.action;
  const id = el.dataset.id;
  const date = el.dataset.date;

  if (action==="prev-month"){ if(!(S.viewYear===RANGE_MIN.y&&S.viewMonth===RANGE_MIN.m)){ if(S.viewMonth===0){S.viewMonth=11;S.viewYear--;} else S.viewMonth--; render(); } }
  else if (action==="next-month"){ if(!(S.viewYear===RANGE_MAX.y&&S.viewMonth===RANGE_MAX.m)){ if(S.viewMonth===11){S.viewMonth=0;S.viewYear++;} else S.viewMonth++; render(); } }
  else if (action==="select-date"){ S.selectedDate=date; S.confirmDeleteId=null; render(); }
  else if (action==="toggle-theme"){ S.theme = S.theme==="dark" ? "light" : "dark"; localStorage.setItem("theme", S.theme); render(); }
  else if (action==="toggle-calendar-style"){ S.calendarStyle = S.calendarStyle==="table" ? "compact" : "table"; localStorage.setItem("calendarStyle", S.calendarStyle); render(); }
  else if (action==="toggle-menu"){ S.menuOpen = !S.menuOpen; render(); }
  else if (action==="go-page"){
    S.page = el.dataset.page; S.menuOpen = false; render();
    if (S.page==="meal" && S.mealRows===null && !S.mealLoading) loadMeal(S.mealDate);
  }
  else if (action==="meal-prev-day"){ const d=parseDate(S.mealDate); d.setDate(d.getDate()-1); S.mealDate=fmt(d); loadMeal(S.mealDate); }
  else if (action==="meal-next-day"){ const d=parseDate(S.mealDate); d.setDate(d.getDate()+1); S.mealDate=fmt(d); loadMeal(S.mealDate); }
  else if (action==="meal-today"){ S.mealDate=todayStr; loadMeal(S.mealDate); }
  else if (action==="open-pw"){ openPasswordModal(); }
  else if (action==="exit-admin"){ S.isAdmin=false; render(); showToast("학생 보기로 돌아왔어요"); }
  else if (action==="open-add-event"){ openEventForm(null); }
  else if (action==="open-edit-event"){ openEventForm(S.events.find(ev=>ev.id===id)); }
  else if (action==="confirm-delete-event"){ S.confirmDeleteId=id; render(); }
  else if (action==="delete-event"){ S.events=S.events.filter(ev=>ev.id!==id); saveToServer(); S.confirmDeleteId=null; render(); showToast("일정을 삭제했어요"); }
  else if (action==="open-dday-manage"){ openDdayManage(); }
  else if (action==="open-redday-manage"){ openRedDayManage(); }
  else if (action==="open-category-manage"){ openCategoryManage(); }
  else if (action==="open-post"){ S.selectedPostId = id; render(); }
  else if (action==="back-to-board-list"){ S.selectedPostId = null; render(); }
  else if (action==="open-add-post"){ openPostForm(null); }
  else if (action==="open-edit-post"){ openPostForm(S.posts.find(p=>p.id===id)); }
  else if (action==="confirm-delete-post"){ S.confirmDeletePostId = id; render(); }
  else if (action==="delete-post"){ S.posts = S.posts.filter(p=>p.id!==id); saveToServer(); S.confirmDeletePostId=null; S.selectedPostId=null; render(); showToast("게시글을 삭제했어요"); }
  else if (action==="open-post-category-manage"){ openPostCategoryManage(); }
  else if (action==="open-banner-manage"){ openBannerManage(); }
  else if (action==="close-modal"){ closeModal(); }
});

/* ---- 비밀번호 모달 ---- */
function openPasswordModal(){
  document.getElementById("modal-root").innerHTML = `
  <div class="fixed inset-0 flex items-center justify-center px-6 z-50" style="background:rgba(0,0,0,0.45)">
    <div class="rounded-xl p-5 w-full max-w-xs surface border border-base">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-base font-bold text-base">관리자 로그인</h3>
        <button data-action="close-modal" class="text-soft">✕</button>
      </div>
      <input id="pw-input" type="password" placeholder="비밀번호" class="w-full rounded-md px-3 py-2 text-sm outline-none border" autofocus />
      <p id="pw-error" class="text-xs mt-1.5" style="color:#C4554D"></p>
      <button id="pw-submit" class="w-full mt-3 rounded-md py-2 text-sm text-white font-bold" style="background:#2E3153">들어가기</button>
    </div>
  </div>`;
  const input = document.getElementById("pw-input");
  input.focus();
  function attempt(){
    if (input.value===ADMIN_PASSWORD){
      S.isAdmin=true; closeModal(); render(); showToast("관리자 모드로 전환했어요");
    } else {
      document.getElementById("pw-error").textContent = "비밀번호가 올바르지 않아요";
    }
  }
  document.getElementById("pw-submit").onclick = attempt;
  input.addEventListener("keydown", e=>{ if(e.key==="Enter") attempt(); });
}
function closeModal(){ document.getElementById("modal-root").innerHTML=""; }

function bindEventFormListeners(){
  document.querySelectorAll(".cat-btn").forEach(btn=>{
    btn.onclick = ()=>{
      FORM.category = btn.dataset.cat;
      FORM.color = btn.dataset.color;
      renderEventFormPreserving();
    };
  });
  document.querySelectorAll("[data-emoji-pick]").forEach(btn=>{
    btn.onclick = ()=>{ document.getElementById("f-emoji").value = btn.dataset.emojiPick; };
  });
  document.querySelectorAll("[data-color-pick]").forEach(btn=>{
    btn.onclick = ()=>{ document.getElementById("f-color").value = btn.dataset.colorPick; };
  });
  document.getElementById("f-start").onchange = (e)=>{
    const endInput = document.getElementById("f-end");
    endInput.min = e.target.value;
    if (endInput.value < e.target.value) endInput.value = e.target.value;
  };
  document.getElementById("f-time-toggle").onclick = ()=>{
    FORM.hasTime = !FORM.hasTime;
    const box = document.getElementById("time-fields");
    box.style.display = FORM.hasTime ? "flex" : "none";
    const btn = document.getElementById("f-time-toggle");
    btn.style.background = FORM.hasTime ? "#2E3153" : "var(--bg-soft)";
    btn.style.color = FORM.hasTime ? "#fff" : "var(--text-soft)";
    btn.textContent = `🕐 시간 설정 ${FORM.hasTime?"끄기":"켜기"}`;
  };
  document.getElementById("f-dday-toggle").onclick = ()=>{
    FORM.showAsDday = !FORM.showAsDday;
    const btn = document.getElementById("f-dday-toggle");
    btn.style.background = FORM.showAsDday ? "#2E3153" : "var(--bg-soft)";
    btn.style.color = FORM.showAsDday ? "#fff" : "var(--text-soft)";
    btn.textContent = `🔥 디데이로 등록 ${FORM.showAsDday?"끄기":"켜기"}`;
  };
  document.getElementById("f-submit").onclick = submitEventForm;
}
function renderEventFormPreserving(){
  FORM.title = document.getElementById("f-title").value;
  FORM.emoji = document.getElementById("f-emoji").value;
  FORM.description = document.getElementById("f-desc").value;
  FORM.memo = document.getElementById("f-memo").value;
  FORM.startDate = document.getElementById("f-start").value;
  FORM.endDate = document.getElementById("f-end").value;
  const st = document.getElementById("f-stime");
  const et = document.getElementById("f-etime");
  if (st) FORM.startTime = st.value;
  if (et) FORM.endTime = et.value;
  renderEventForm();
}
function submitEventForm(){
  const title = document.getElementById("f-title").value.trim();
  const startDate = document.getElementById("f-start").value;
  const endDate = document.getElementById("f-end").value;
  if (!title){ showToast("제목을 입력해 주세요"); return; }
  if (endDate < startDate){ showToast("종료일이 시작일보다 빠를 수 없어요"); return; }
  const payload = {
    id: FORM.id || uid(),
    title,
    emoji: document.getElementById("f-emoji").value,
    category: FORM.category,
    color: document.getElementById("f-color").value,
    startDate, endDate,
    hasTime: FORM.hasTime,
    startTime: document.getElementById("f-stime") ? document.getElementById("f-stime").value : "09:00",
    endTime: document.getElementById("f-etime") ? document.getElementById("f-etime").value : "",
    description: document.getElementById("f-desc").value,
    memo: document.getElementById("f-memo").value,
    showAsDday: !!FORM.showAsDday,
  };
  if (FORM.id) S.events = S.events.map(ev=> ev.id===FORM.id ? payload : ev);
  else S.events = [...S.events, payload];
  saveToServer();
  closeModal();
  render();
  showToast(FORM.id ? "일정을 수정했어요" : "일정을 추가했어요");
}

  document.getElementById("d-submit").onclick = ()=>{
    const title = document.getElementById("d-title").value.trim();
    const startDate = isRange ? document.getElementById("d-start-range").value : document.getElementById("d-start-single").value;

// TIMETABLE에서 금요일 5교시 span=2 칸 바로 다음(6교시, 금요일)은 렌더링에서 건너뛰도록 표시
(function markSpannedCells(){
  for (let p=0;p<TIMETABLE.length;p++){
    for (let d=0; d<5; d++){

/* ---- 이미지 압축 (jsonbin 용량 제한 대응) ---- */
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 700;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.6));
      };
      img.onerror = ()=>reject(new Error("이미지를 읽지 못했어요"));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error("파일을 읽지 못했어요"));
    reader.readAsDataURL(file);
  });
}

    const label = document.getElementById("pc-label").value.trim();
    const color = document.getElementById("pc-color").value;
    if (!label){ showToast("이름을 입력해 주세요"); return; }
    if (PCFORM && PCFORM.key) S.postCategories = S.postCategories.map(c=> c.key===PCFORM.key ? { ...c, label, color } : c);
    else S.postCategories = [...S.postCategories, { key: uid(), label, color }];
    saveToServer();
    PCFORM = null;
    renderPostCategoryManage();
    showToast("저장했어요");
  };
}

/* ---- 시작 ---- */
loadFromServer();
</script>
</body>
