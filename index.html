<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026 안산강서고 1-12</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');
  * { font-family: 'Gowun Dodum', sans-serif; box-sizing: border-box; }

  :root[data-theme="light"] {
    --bg: #ffffff;
    --bg-soft: #f7f6f3;
    --card: #ffffff;
    --border: #e9e7e2;
    --text: #37352f;
    --text-soft: #6b6a66;
    --text-faint: #9b9a97;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 1px 6px rgba(0,0,0,0.03);
  }
  :root[data-theme="dark"] {
    --bg: #191919;
    --bg-soft: #202020;
    --card: #252525;
    --border: #373737;
    --text: #e7e6e4;
    --text-soft: #a3a2a0;
    --text-faint: #7c7b79;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 8px rgba(0,0,0,0.25);
  }
  body { background:var(--bg); color:var(--text); margin:0; transition:background .15s,color .15s; }
  .surface { background:var(--card); }
  .surface-soft { background:var(--bg-soft); }
  .border-base { border-color:var(--border) !important; }
  .text-base { color:var(--text); }
  .text-soft { color:var(--text-soft); }
  .text-faint { color:var(--text-faint); }
  input[type="color"] { padding:0; cursor:pointer; }
  input, textarea, select { background:var(--card); color:var(--text); border-color:var(--border) !important; }
  input::placeholder, textarea::placeholder { color:var(--text-faint); }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div id="app" class="w-full pb-16"></div>
<div id="modal-root"></div>

<script>
/* ---- jsonbin.io 저장소 ---- */
const BIN_ID = "6a843962da38895dfef25639";
const API_KEY = "$2a$10$P2WtaLldQWuUHzPlezDzwOvssikwdRmYAjlEgTGs0D2EeiUcT7Dwm";
const DATA_URL = "https://api.jsonbin.io/v3/b/" + BIN_ID;

/* ---- 노션풍 태그 색상 팔레트 ---- */
const NOTION_COLORS = {
  orange:{ lbg:"#FAEBDD", ltext:"#B4620F", dbg:"#4a3320", dtext:"#e8a561" },
  purple:{ lbg:"#F6F3F9", ltext:"#8A67AB", dbg:"#392f47", dtext:"#c39ee0" },
  yellow:{ lbg:"#FBF3DB", ltext:"#A9821A", dbg:"#4a3f1c", dtext:"#e0c46c" },
  red:   { lbg:"#FDEBEC", ltext:"#C4554D", dbg:"#452321", dtext:"#e5837a" },
  green: { lbg:"#EDF3EC", ltext:"#4C7A5C", dbg:"#22362b", dtext:"#7cc99a" },
  blue:  { lbg:"#E7F3F8", ltext:"#3E76A0", dbg:"#1c3547", dtext:"#7bb4dd" },
};
const CATEGORIES = [
  { key: "homework", label: "숙제", tone:"orange", color: "#D98A2B", checkable: true },
  { key: "notice", label: "가정통신문", tone:"purple", color: "#6B5FAE", checkable: true },
  { key: "eval", label: "수행평가", tone:"yellow", color: "#C15A42", checkable: false },
  { key: "exam", label: "정기고사", tone:"red", color: "#A1332B", checkable: false },
  { key: "event", label: "행사", tone:"green", color: "#2C8C7F", checkable: false },
  { key: "alert", label: "알림", tone:"blue", color: "#3E7CB1", checkable: false },
];
const SWATCHES = [
  "#D98A2B","#6B5FAE","#C15A42","#A1332B","#2C8C7F","#3E7CB1","#5B8A3C","#B45A9E",
  "#F7C6C7","#FBE4B0","#C9E4CA","#B5D8EB","#D6C7E8","#F9D5B0","#B8E0D2","#E8C7DE",
];
const EMOJI_PRESETS = ["📚","✏️","📝","🎉","📢","🧪","⏰","📌","🏆","📅"];
const ADMIN_PASSWORD = "829922";
const RANGE_MIN = { y: 2026, m: 7 };
const RANGE_MAX = { y: 2027, m: 2 };
const MIN_DATE_STR = "2026-08-01";
const MAX_DATE_STR = "2027-03-31";
const WEEKDAYS = ["일","월","화","수","목","금","토"];

/* ---- 2026.8 ~ 2027.3 대한민국 법정 공휴일(기본 제공) ---- */
const BUILTIN_HOLIDAYS = [
  { date:"2026-08-15", label:"광복절" },
  { date:"2026-09-24", label:"추석 연휴" },
  { date:"2026-09-25", label:"추석" },
  { date:"2026-09-26", label:"추석 연휴" },
  { date:"2026-10-03", label:"개천절" },
  { date:"2026-10-05", label:"대체공휴일(개천절)" },
  { date:"2026-10-09", label:"한글날" },
  { date:"2026-12-25", label:"크리스마스" },
  { date:"2027-01-01", label:"신정" },
  { date:"2027-02-06", label:"설날 연휴" },
  { date:"2027-02-07", label:"설날" },
  { date:"2027-02-08", label:"설날 연휴" },
  { date:"2027-02-09", label:"대체공휴일(설날)" },
  { date:"2027-03-01", label:"삼일절" },
];

function pad(n){ return String(n).padStart(2,"0"); }
function fmt(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function diffDays(a,b){ return Math.round((b-a)/86400000); }
function getCategory(key){ return CATEGORIES.find(c=>c.key===key) || CATEGORIES[0]; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function clampToRange(y,m){
  if (y < RANGE_MIN.y || (y===RANGE_MIN.y && m<RANGE_MIN.m)) return {y:RANGE_MIN.y,m:RANGE_MIN.m};
  if (y > RANGE_MAX.y || (y===RANGE_MAX.y && m>RANGE_MAX.m)) return {y:RANGE_MAX.y,m:RANGE_MAX.m};
  return {y,m};
}
function redDayLabel(dateStr){
  const b = BUILTIN_HOLIDAYS.find(h=>h.date===dateStr);
  if (b) return b.label;
  const c = S.redDays.find(r=>r.date===dateStr);
  if (c) return c.label;
  return null;
}
function isRedDay(dateStr){ return !!redDayLabel(dateStr); }

const today = new Date();
const todayStr = fmt(today);
const initial = clampToRange(today.getFullYear(), today.getMonth());

const S = {
  viewYear: initial.y,
  viewMonth: initial.m,
  selectedDate: (todayStr>=MIN_DATE_STR && todayStr<=MAX_DATE_STR) ? todayStr : MIN_DATE_STR,
  events: [],
  ddays: [],
  redDays: [],
  banner: { lines: [] },
  isAdmin: false,
  theme: localStorage.getItem("theme") === "dark" ? "dark" : "light",
  toast: "",
  loading: true,
};
document.documentElement.setAttribute("data-theme", S.theme);

/* ---- jsonbin 자동 불러오기/저장 ---- */
async function loadFromServer(){
  try {
    const res = await fetch(DATA_URL + "/latest", { headers: { "X-Master-Key": API_KEY, "X-Bin-Meta": "false" } });
    if (!res.ok) throw new Error("fetch failed");
    const data = await res.json();
    S.events = Array.isArray(data.events) ? data.events : [];
    S.ddays = Array.isArray(data.ddays) ? data.ddays : [];
    S.redDays = Array.isArray(data.redDays) ? data.redDays : [];
    S.banner = data.banner && Array.isArray(data.banner.lines) ? data.banner : { lines: [] };
  } catch (e) {}
  S.loading = false;
  render();
}
async function saveToServer(){
  try {
    await fetch(DATA_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
      body: JSON.stringify({ events: S.events, ddays: S.ddays, redDays: S.redDays, banner: S.banner }),
    });
  } catch (e) {}
}
setInterval(()=>{
  const modalOpen = document.getElementById("modal-root") && document.getElementById("modal-root").innerHTML.trim()!=="";
  if (!modalOpen) loadFromServer();
}, 20000);

function showToast(msg){
  S.toast = msg;
  render();
  setTimeout(()=>{ S.toast=""; const t=document.getElementById("toast"); if(t) t.remove(); }, 1800);
}

/* ---- 계산 로직 ---- */
function ddayCountdown(dateStr){
  const diff = diffDays(parseDate(todayStr), parseDate(dateStr));
  if (diff>0) return { text:`D-${diff}`, tone:"#2E3153" };
  if (diff===0) return { text:"D-DAY", tone:"#2C8C7F" };
  return { text:"지남", tone:"#9b9a97" };
}
function buildWeeks(viewYear, viewMonth){
  const firstDow = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const totalCells = Math.ceil((firstDow+daysInMonth)/7)*7;
  const cells = [];
  for (let i=0;i<totalCells;i++){
    const dayNum = i-firstDow+1;
    const dateObj = new Date(viewYear, viewMonth, dayNum);
    cells.push({ d: dateObj.getDate(), dateObj, inMonth: dayNum>=1 && dayNum<=daysInMonth });
  }
  const weeks = [];
  for (let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  return weeks;
}
function buildBars(weeks, barSource){
  return weeks.map(week=>{
    const weekStartStr = fmt(week[0].dateObj);
    const weekEndStr = fmt(week[6].dateObj);
    const overlapping = barSource.filter(it=> it.endDate>=weekStartStr && it.startDate<=weekEndStr);
    const sorted = [...overlapping].sort((a,b)=>{
      if (a.startDate!==b.startDate) return a.startDate<b.startDate?-1:1;
      return b.endDate.localeCompare(a.endDate);
    });
    const laneEnds = [];
    const bars = sorted.map(item=>{
      const cs = item.startDate<weekStartStr ? weekStartStr : item.startDate;
      const ce = item.endDate>weekEndStr ? weekEndStr : item.endDate;
      const startCol = diffDays(week[0].dateObj, parseDate(cs));
      const endCol = diffDays(week[0].dateObj, parseDate(ce));
      let lane = laneEnds.findIndex(e=>e<startCol);
      if (lane===-1){ lane=laneEnds.length; laneEnds.push(endCol); } else laneEnds[lane]=endCol;
      return { item, startCol, span: endCol-startCol+1, lane };
    });
    return { week, bars, laneCount: laneEnds.length };
  });
}
function eventsOnDate(dateStr){
  return S.events.filter(ev=> ev.startDate<=dateStr && ev.endDate>=dateStr)
    .sort((a,b)=> a.startDate<b.startDate?-1:1);
}

/* ---- 렌더링 ---- */
function render(){
  document.documentElement.setAttribute("data-theme", S.theme);
  if (S.loading){
    document.getElementById("app").innerHTML = `<div class="max-w-2xl mx-auto px-5 py-16 text-center text-sm text-faint">불러오는 중...</div>`;
    return;
  }
  const weeks = buildWeeks(S.viewYear, S.viewMonth);
  const barSource = [
    ...S.events.map(ev=>({ id:ev.id, title:ev.title, emoji:ev.emoji, color:ev.color, startDate:ev.startDate, endDate:ev.endDate })),
    ...S.ddays.map(d=>({ id:"dday-"+d.id, title:d.title, emoji:d.emoji, color:d.color, startDate:d.startDate, endDate:d.endDate })),
  ];
  const weeksWithBars = buildBars(weeks, barSource);
  const atMin = S.viewYear===RANGE_MIN.y && S.viewMonth===RANGE_MIN.m;
  const atMax = S.viewYear===RANGE_MAX.y && S.viewMonth===RANGE_MAX.m;
  const ddaySorted = [...S.ddays].sort((a,b)=> a.startDate<b.startDate?-1:1);
  const selectedEvents = eventsOnDate(S.selectedDate);
  const selectedHoliday = redDayLabel(S.selectedDate);

  let html = `
  <div class="px-5 pt-7 pb-5 max-w-2xl mx-auto">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-bold text-base">2026 안산강서고 1-12</h1>
      <div class="flex items-center gap-2">
        <button data-action="toggle-theme" class="flex items-center justify-center rounded-full surface-soft border border-base" style="width:30px;height:30px">${S.theme==="dark" ? "☀️" : "🌙"}</button>
        ${S.isAdmin
          ? `<button data-action="exit-admin" class="flex items-center gap-1 text-xs px-3 py-1.5 rounded-full text-white" style="background:#6B5FAE">🔓 관리자</button>`
          : `<button data-action="open-pw" class="flex items-center gap-1 text-xs px-3 py-1.5 rounded-full surface-soft text-soft border border-base">🔒 관리자</button>`}
      </div>
    </div>
  </div>`;

  // 고정 알림 배너
  if (S.banner.lines.length>0 || S.isAdmin){
    html += `<div class="max-w-2xl mx-auto px-5 mb-4">
      <div class="rounded-lg p-3 surface border border-base" style="box-shadow:var(--shadow)">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-bold flex items-center gap-1 text-soft">📌 알림</span>
          ${S.isAdmin ? `<button data-action="open-banner-manage" class="text-[11px] underline text-soft">편집</button>` : ""}
        </div>
        ${S.banner.lines.length>0
          ? `<ul class="text-xs text-base" style="padding-left:16px;list-style:disc">${S.banner.lines.map(l=>`<li class="mb-0.5">${esc(l)}</li>`).join("")}</ul>`
          : (S.isAdmin ? `<p class="text-xs text-faint">등록된 알림이 없어요.</p>` : "")}
      </div>
    </div>`;
  }

  html += `<div class="max-w-2xl mx-auto px-5">
    <div class="flex items-center justify-center gap-4 mb-4">
      <button data-action="prev-month" ${atMin?"disabled":""} class="p-1.5 rounded-full surface-soft border border-base" style="opacity:${atMin?0.3:1}">‹</button>
      <div class="text-lg font-bold w-32 text-center text-base">${S.viewYear}년 ${S.viewMonth+1}월</div>
      <button data-action="next-month" ${atMax?"disabled":""} class="p-1.5 rounded-full surface-soft border border-base" style="opacity:${atMax?0.3:1}">›</button>
    </div>
  </div>`;

  // D-day widget
  if (ddaySorted.length>0 || S.isAdmin){
    html += `<div class="max-w-2xl mx-auto px-5 mb-4">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-xs font-bold text-soft">디데이</span>
        ${S.isAdmin ? `<button data-action="open-dday-manage" class="flex items-center gap-1 text-[11px] px-2 py-1 rounded-full text-white" style="background:#2E3153">＋ 디데이 관리</button>` : ""}
      </div>
      ${ddaySorted.length>0 ? `<div class="flex gap-2 overflow-x-auto pb-1">${ddaySorted.map(item=>{
        const dd = ddayCountdown(item.startDate);
        return `<div class="flex-shrink-0 rounded-lg px-3 py-2 surface border border-base" style="border-left:4px solid ${item.color};min-width:108px;box-shadow:var(--shadow)">
          <div class="text-[11px] font-bold" style="color:${dd.tone}">${dd.text}</div>
          <div class="text-xs mt-0.5 truncate text-base" style="max-width:100px">${esc(item.emoji)} ${esc(item.title)}</div>
        </div>`;
      }).join("")}</div>` : (S.isAdmin ? `<p class="text-xs text-faint">등록된 디데이가 없어요.</p>` : "")}
    </div>`;
  }

  // Calendar
  html += `<div class="max-w-2xl mx-auto px-5">
    <div class="grid grid-cols-7 text-center text-xs mb-1">
      ${WEEKDAYS.map((w,i)=>`<div class="py-1 font-bold" style="color:${i===0?'#C4554D':i===6?'#3E76A0':'var(--text-faint)'}">${w}</div>`).join("")}
    </div>
    <div class="flex flex-col gap-0.5">
      ${weeksWithBars.map(wk=>{
        const weekHasSelected = wk.week.some(c=>fmt(c.dateObj)===S.selectedDate);
        return `<div class="rounded-md ${weekHasSelected?'surface-soft':''}">
          <div class="grid grid-cols-7">
            ${wk.week.map(cell=>{
              const dateStr = fmt(cell.dateObj);
              const dow = cell.dateObj.getDay();
              const inRange = dateStr>=MIN_DATE_STR && dateStr<=MAX_DATE_STR;
              const isSelected = dateStr===S.selectedDate;
              const isToday = dateStr===todayStr;
              const holiday = isRedDay(dateStr);
              const numColor = isSelected ? '#fff' : holiday ? '#C4554D' : dow===0 ? '#C4554D' : dow===6 ? '#3E76A0' : 'var(--text)';
              return `<button data-action="select-date" data-date="${dateStr}" ${inRange?"":"disabled"} class="flex items-center justify-center py-1" style="opacity:${cell.inMonth&&inRange?1:0.28}">
                <span class="text-xs w-6 h-6 flex items-center justify-center rounded-full" style="color:${numColor};background:${isSelected?'#2E3153':'transparent'};font-weight:${isToday||isSelected?700:500};border:${isToday&&!isSelected?'1.5px solid #2E3153':'none'}">${cell.d}</span>
              </button>`;
            }).join("")}
          </div>
          ${wk.laneCount>0 ? `<div class="relative px-0.5 pb-1" style="height:${wk.laneCount*20}px">
            ${wk.bars.map(b=>`<button data-action="select-date" data-date="${b.item.startDate}" class="absolute text-[10px] px-1.5 flex items-center rounded truncate text-white text-left" style="left:${(b.startCol/7)*100}%;width:calc(${(b.span/7)*100}% - 3px);top:${b.lane*20}px;height:17px;background:${b.item.color};font-weight:600">${esc(b.item.emoji)} ${esc(b.item.title)}</button>`).join("")}
          </div>` : ""}
        </div>`;
      }).join("")}
    </div>
  </div>`;

  // Day detail
  html += `<div class="max-w-2xl mx-auto px-5 mt-6">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <h2 class="text-base font-bold text-base">${Number(S.selectedDate.split("-")[1])}월 ${Number(S.selectedDate.split("-")[2])}일</h2>
        ${selectedHoliday ? `<span class="text-xs font-bold px-2 py-0.5 rounded" style="background:${NOTION_COLORS.red.lbg};color:${NOTION_COLORS.red.ltext}">${esc(selectedHoliday)}</span>` : ""}
        ${S.isAdmin ? `<button data-action="open-redday-manage" class="text-[11px] underline text-soft">빨간날 관리</button>` : ""}
      </div>
      ${S.isAdmin ? `<button data-action="open-add-event" class="flex items-center gap-1 text-xs px-3 py-1.5 rounded-full text-white" style="background:#2E3153">＋ 일정 추가</button>` : ""}
    </div>
    ${selectedEvents.length===0
      ? `<p class="text-sm py-6 text-center rounded-lg surface-soft text-faint">등록된 일정이 없어요.</p>`
      : `<ul class="flex flex-col gap-2">${selectedEvents.map(ev=>{
          const cat = getCategory(ev.category);
          const tone = NOTION_COLORS[cat.tone] || NOTION_COLORS.gray;
          const isRange = ev.startDate!==ev.endDate;
          return `<li class="rounded-lg p-3 flex items-start gap-2 surface border border-base" style="border-left:4px solid ${ev.color};box-shadow:var(--shadow)">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-[10px] px-2 py-0.5 rounded-full font-bold" style="background:${S.theme==='dark'?tone.dbg:tone.lbg};color:${S.theme==='dark'?tone.dtext:tone.ltext}">${cat.label}</span>
                ${(ev.tags||[]).map(t=>`<span class="text-[10px] px-1.5 py-0.5 rounded text-soft surface-soft">#${esc(t)}</span>`).join("")}
              </div>
              <div class="text-sm font-bold mt-1 text-base">${esc(ev.emoji)} ${esc(ev.title)}</div>
              <div class="text-[11px] mt-0.5 flex items-center gap-2 flex-wrap text-faint">
                ${isRange?`<span>${ev.startDate.slice(5)} ~ ${ev.endDate.slice(5)}</span>`:""}
                ${ev.hasTime?`<span>🕐 ${ev.startTime}${ev.endTime?` ~ ${ev.endTime}`:""}</span>`:""}
              </div>
              ${ev.memo?`<p class="text-xs mt-1 text-soft">${esc(ev.memo)}</p>`:""}
            </div>
            <div class="flex flex-col items-end gap-2 flex-shrink-0">
              ${S.isAdmin
                ? `<div class="flex gap-1">
                    <button data-action="open-edit-event" data-id="${ev.id}" class="p-1.5 rounded-md surface-soft">✎</button>
                    ${S.confirmDeleteId===ev.id
                      ? `<button data-action="delete-event" data-id="${ev.id}" class="p-1.5 rounded-md text-white text-[10px] px-2" style="background:#B23A32">확인</button>`
                      : `<button data-action="confirm-delete-event" data-id="${ev.id}" class="p-1.5 rounded-md surface-soft">🗑</button>`}
                  </div>`
                : ""}
            </div>
          </li>`;
        }).join("")}</ul>`}
  </div>`;

  if (S.toast) html += `<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 text-xs px-4 py-2 rounded-full text-white z-50" style="background:#2A2622;transform:translateX(-50%)">${esc(S.toast)}</div>`;

  document.getElementById("app").innerHTML = html;
}

/* ---- 액션 처리 ---- */
document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  const date = el.dataset.date;

  if (action==="prev-month"){ if(!(S.viewYear===RANGE_MIN.y&&S.viewMonth===RANGE_MIN.m)){ if(S.viewMonth===0){S.viewMonth=11;S.viewYear--;} else S.viewMonth--; render(); } }
  else if (action==="next-month"){ if(!(S.viewYear===RANGE_MAX.y&&S.viewMonth===RANGE_MAX.m)){ if(S.viewMonth===11){S.viewMonth=0;S.viewYear++;} else S.viewMonth++; render(); } }
  else if (action==="select-date"){ S.selectedDate=date; S.confirmDeleteId=null; render(); }
  else if (action==="toggle-theme"){ S.theme = S.theme==="dark" ? "light" : "dark"; localStorage.setItem("theme", S.theme); render(); }
  else if (action==="open-pw"){ openPasswordModal(); }
  else if (action==="exit-admin"){ S.isAdmin=false; render(); showToast("학생 보기로 돌아왔어요"); }
  else if (action==="open-add-event"){ openEventForm(null); }
  else if (action==="open-edit-event"){ openEventForm(S.events.find(ev=>ev.id===id)); }
  else if (action==="confirm-delete-event"){ S.confirmDeleteId=id; render(); }
  else if (action==="delete-event"){ S.events=S.events.filter(ev=>ev.id!==id); saveToServer(); S.confirmDeleteId=null; render(); showToast("일정을 삭제했어요"); }
  else if (action==="open-dday-manage"){ openDdayManage(); }
  else if (action==="open-redday-manage"){ openRedDayManage(); }
  else if (action==="open-banner-manage"){ openBannerManage(); }
  else if (action==="close-modal"){ closeModal(); }
});

      renderEventFormPreserving();

  });

    endInput.min = e.target.value;
    if (endInput.value < e.target.value) endInput.value = e.target.value;
  };
  document.getElementById("f-time-toggle").onclick = ()=>{

  };

function renderEventFormPreserving(){
  FORM.title = document.getElementById("f-title").value;
  FORM.emoji = document.getElementById("f-emoji").value;
  FORM.memo = document.getElementById("f-memo").value;
  renderEventForm();
}
function addTagFromInput(){
  const input = document.getElementById("f-tag-input");
  const t = input.value.trim();
  if (t && !FORM.tags.includes(t)) FORM.tags.push(t);
  input.value = "";
  refreshTagList();
}
function refreshTagList(){
  document.getElementById("f-tag-list").innerHTML = FORM.tags.map(t=>`<span class="tag-chip text-[11px] px-2 py-0.5 rounded flex items-center gap-1 surface-soft text-soft" data-tag="${esc(t)}">#${esc(t)} <button data-tag-remove="${esc(t)}">✕</button></span>`).join("");
}
function submitEventForm(){
  const title = document.getElementById("f-title").value.trim();
  const startDate = document.getElementById("f-start").value;
  const endDate = document.getElementById("f-end").value;
  if (!title){ showToast("제목을 입력해 주세요"); return; }
  if (endDate < startDate){ showToast("종료일이 시작일보다 빠를 수 없어요"); return; }
  const payload = {
    id: FORM.id || uid(),
    title,
    emoji: document.getElementById("f-emoji").value,
    category: FORM.category,
    color: document.getElementById("f-color").value,
    startDate, endDate,
    hasTime: FORM.hasTime,
    startTime: document.getElementById("f-stime") ? document.getElementById("f-stime").value : "09:00",
    endTime: document.getElementById("f-etime") ? document.getElementById("f-etime").value : "",
    tags: FORM.tags,
    memo: document.getElementById("f-memo").value,
  };
  if (FORM.id) S.events = S.events.map(ev=> ev.id===FORM.id ? payload : ev);
  else S.events = [...S.events, payload];
  saveToServer();
  closeModal();
  render();
  showToast(FORM.id ? "일정을 수정했어요" : "일정을 추가했어요");
}

              ? `<button data-red-delete="${item.id}" class="p-1.5 rounded-md text-white text-[10px] px-2" style="background:#B23A32">확인</button>`
              : `<button data-red-confirm-delete="${item.id}" class="p-1.5 rounded-md surface">🗑</button>`}
          </div>
        </li>`).join("")}</ul>` : `<p class="text-xs text-faint mb-4">직접 추가한 빨간날이 없어요.</p>`}
      <div class="flex flex-col gap-3 pt-3 border-t border-base">
        <p class="text-xs font-bold text-soft">${f.id?"빨간날 수정":"새 빨간날 추가"}</p>
        <input id="r-label" type="text" value="${esc(f.label)}" placeholder="예: 학교 창립기념일" class="w-full rounded-md px-3 py-2 text-sm outline-none border" />
        <input id="r-date" type="date" value="${f.date}" min="${MIN_DATE_STR}" max="${MAX_DATE_STR}" class="w-full rounded-md px-3 py-2 text-sm outline-none border" />
        <div class="flex gap-2">
          ${f.id ? `<button id="r-cancel" class="flex-1 rounded-md py-2.5 text-sm font-bold surface-soft text-soft">취소</button>` : ""}
          <button id="r-submit" class="flex-1 rounded-md py-2.5 text-sm text-white font-bold" style="background:#2E3153">${f.id?"수정 완료":"추가하기"}</button>
        </div>
      </div>
    </div>
  </div>`;
  bindRedDayListeners();
}
function bindRedDayListeners(){
  document.getElementById("add-holidays").onclick = ()=>{
    const existing = new Set(S.redDays.map(r=>r.date));
    const toAdd = BUILTIN_HOLIDAYS.filter(h=>!existing.has(h.date)).map(h=>({ id: uid(), label:h.label, date:h.date }));
    S.redDays = [...S.redDays, ...toAdd];
    saveToServer();
    renderRedDayManage();
    render();
    showToast(toAdd.length>0 ? `${toAdd.length}개 추가했어요` : "이미 모두 추가되어 있어요");
  };
  document.querySelectorAll("[data-red-edit]").forEach(btn=>{
    btn.onclick = ()=>{ const item = S.redDays.find(r=>r.id===btn.dataset.redEdit); RFORM = { ...item }; renderRedDayManage(); };
  });
  document.querySelectorAll("[data-red-confirm-delete]").forEach(btn=>{
    btn.onclick = ()=>{ S.confirmDeleteRedId = btn.dataset.redConfirmDelete; renderRedDayManage(); };
  });
  document.querySelectorAll("[data-red-delete]").forEach(btn=>{
    btn.onclick = ()=>{ S.redDays = S.redDays.filter(r=>r.id!==btn.dataset.redDelete); saveToServer(); S.confirmDeleteRedId=null; renderRedDayManage(); render(); showToast("삭제했어요"); };
  });
  const cancelBtn = document.getElementById("r-cancel");
  if (cancelBtn) cancelBtn.onclick = ()=>{ RFORM=null; renderRedDayManage(); };
  document.getElementById("r-submit").onclick = ()=>{
    const label = document.getElementById("r-label").value.trim();
    const date = document.getElementById("r-date").value;
    if (!label || !date){ showToast("이름과 날짜를 입력해 주세요"); return; }
    const payload = { label, date };
    if (RFORM && RFORM.id) S.redDays = S.redDays.map(r=> r.id===RFORM.id ? { ...payload, id:RFORM.id } : r);
    else S.redDays = [...S.redDays, { ...payload, id: uid() }];
    saveToServer();
    RFORM = null;
    renderRedDayManage();
    render();
    showToast("저장했어요");
  };
}

/* ---- 배너(고정 알림) 관리 모달 ---- */
function openBannerManage(){
  document.getElementById("modal-root").innerHTML = `
  <div class="fixed inset-0 flex items-center justify-center px-6 z-50" style="background:rgba(0,0,0,0.45)">
    <div class="rounded-xl p-5 w-full max-w-md surface border border-base">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-base font-bold text-base">📌 알림 배너 편집</h3>
        <button data-action="close-modal" class="text-soft">✕</button>
      </div>
      <p class="text-[11px] text-faint mb-2">한 줄에 하나씩 입력하면 각 줄이 알림 목록의 항목이 돼요.</p>
      <textarea id="banner-text" rows="6" placeholder="예: 시간표 변경 (화)사회 ↔ (목)과탐&#10;화학 수행 추석 전 주, 과탐실 수행 9월 1주" class="w-full rounded-md px-3 py-2 text-sm outline-none border resize-none">${esc(S.banner.lines.join("\n"))}</textarea>
      <button id="banner-submit" class="w-full mt-3 rounded-md py-2 text-sm text-white font-bold" style="background:#2E3153">저장하기</button>
    </div>
  </div>`;
  document.getElementById("banner-submit").onclick = ()=>{
    const lines = document.getElementById("banner-text").value.split("\n").map(l=>l.trim()).filter(Boolean);
    S.banner = { lines };
    saveToServer();
    closeModal();
    render();
    showToast("알림 배너를 저장했어요");
  };
}

loadFromServer();
